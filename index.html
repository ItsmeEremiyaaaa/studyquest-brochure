<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyQuest – Interactive Brochure</title>
<meta name="description" content="Flip through the StudyQuest trifold brochure: a gamified quiz app for SMCBI students.">
<link rel="icon" href="jax.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B1D14; --cream:#FFF6EC; --peach:#F6D9BF; --orange:#E9935B; --burnt:#A9521C;
    --purple:#5B3FB8; --gold:#F2B33D;
    --w:300; --h:695;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:'Nunito',system-ui,sans-serif; color:var(--ink); overflow-x:hidden;
    background-color:var(--cream);
    background-image:radial-gradient(circle,#EFD9C3 1.3px,transparent 1.6px);
    background-size:22px 22px;
  }
  .blob{position:fixed;border-radius:50%;z-index:0;pointer-events:none}
  .blob.a{width:520px;height:520px;background:#F6D9BF;left:-180px;top:-200px}
  .blob.b{width:420px;height:420px;background:#ECE6FB;right:-140px;bottom:-160px}

  header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px clamp(16px,4vw,40px) 0}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:24px;text-decoration:none;color:var(--ink)}
  .brand img{width:38px;height:auto}
  .brand span{color:var(--burnt)}
  .tag{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:var(--purple);color:#fff;padding:6px 12px;border-radius:99px}

  main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:8px 16px 28px}
  .stage{position:relative;width:100%;display:flex;justify-content:center;align-items:center;perspective:2400px;perspective-origin:50% 40%;touch-action:pan-y}
  .floor{position:absolute;left:50%;bottom:6px;height:34px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(43,29,20,.28),rgba(43,29,20,0) 70%);transform:translateX(-50%);transition:width .9s cubic-bezier(.6,.05,.2,1);pointer-events:none}
  .tilt{transform-style:preserve-3d;transition:transform .35s ease-out}
  .float{transform-style:preserve-3d;animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .book{position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.6,.05,.2,1);cursor:pointer}
  .book.intro{animation:intro 1.1s cubic-bezier(.2,.8,.2,1) both}
  @keyframes intro{from{opacity:0;transform:translateY(60px) rotateX(35deg) rotateZ(-6deg) scale(.85)}to{opacity:1}}
  .sheet{position:absolute;top:0;width:100%;height:100%;transform-style:preserve-3d}
  .center{left:0}
  .wing.left{left:-100%;transform-origin:right center}
  .wing.right{left:100%;transform-origin:left center}
  .face{position:absolute;inset:0;background-size:cover;background-position:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 18px 40px rgba(43,29,20,.18);overflow:hidden}
  .face.back{transform:rotateY(180deg)}
  .shade{position:absolute;inset:0;pointer-events:none;opacity:0}
  .left .front .shade{background:linear-gradient(90deg,rgba(43,29,20,.05),rgba(43,29,20,.55))}
  .left .back .shade{background:linear-gradient(270deg,rgba(255,255,255,.0),rgba(255,255,255,.35))}
  .right .front .shade{background:linear-gradient(270deg,rgba(43,29,20,.05),rgba(43,29,20,.55))}
  .right .back .shade{background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.35))}
  .crease-l::after,.crease-r::after{content:"";position:absolute;top:0;bottom:0;width:18px;pointer-events:none}
  .crease-l::after{left:0;background:linear-gradient(90deg,rgba(43,29,20,.10),transparent)}
  .crease-r::after{right:0;background:linear-gradient(270deg,rgba(43,29,20,.10),transparent)}

  .hint{position:absolute;left:50%;bottom:-4px;transform:translate(-50%,0);background:var(--ink);color:var(--cream);font-weight:800;font-size:14px;padding:10px 16px;border-radius:99px;display:flex;align-items:center;gap:8px;pointer-events:none;box-shadow:0 8px 18px rgba(43,29,20,.25);animation:bob 1.6s ease-in-out infinite;transition:opacity .4s;z-index:5;white-space:nowrap}
  .hint.hide{opacity:0}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}

  .spark{position:absolute;left:50%;top:50%;width:16px;height:16px;pointer-events:none;z-index:6}
  .spark svg{width:100%;height:100%}
  .spark{animation:burst 1.1s cubic-bezier(.15,.7,.3,1) forwards}
  @keyframes burst{0%{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(160deg);opacity:0}}

  .caption{margin-top:14px;min-height:52px;text-align:center}
  .caption h1{margin:0;font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(20px,3vw,26px);line-height:1.15}
  .caption p{margin:4px 0 0;font-size:15px;font-weight:700;color:#5A4434}

  .controls{margin-top:14px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}
  button,.btn{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:14px;padding:12px 18px;min-height:46px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:transform .15s,box-shadow .15s,background .15s}
  button:active,.btn:active{transform:translateY(2px)}
  .primary{background:var(--orange);color:var(--ink);box-shadow:0 4px 0 #C9682C}
  .primary:hover{background:#EFA16D}
  .ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #E8D3BC}
  .ghost:hover{background:#FFF1E2}
  .dark{background:var(--ink);color:var(--cream);box-shadow:0 4px 0 #000}
  button:disabled{opacity:.45;cursor:default}
  button:focus-visible,.btn:focus-visible{outline:3px solid var(--purple);outline-offset:3px}

  .dots{display:flex;gap:8px;margin-top:16px}
  .dot{width:12px;height:12px;border-radius:99px;background:#E2C6AA;border:0;padding:0;min-height:0;transition:width .3s,background .3s}
  .dot.on{width:30px;background:var(--orange)}

  footer{position:relative;z-index:1;text-align:center;padding:10px 16px 28px;font-size:14px;font-weight:700;color:#5A4434}
  footer a{color:var(--burnt)}
  .kbd{display:inline-block;font-size:12px;border:1.5px solid #D9BFA5;border-radius:6px;padding:0 6px;margin:0 2px;background:#fff}
  @media (max-width:560px){ .tag{display:none} .kbdline{display:none} }
  @media (prefers-reduced-motion:reduce){ .float,.hint,.book.intro{animation:none} .book,.floor{transition:none} }
</style>
</head>
<body>
<div class="blob a"></div><div class="blob b"></div>

<header>
  <a class="brand" href="https://studyquest-a547c.web.app" target="_blank" rel="noopener"><img src="jax.png" alt="">Study<span>Quest</span></a>
  <div class="tag">Interactive brochure</div>
</header>

<main>
  <div class="stage" id="stage">
    <div class="floor" id="floor"></div>
    <div class="tilt" id="tilt">
      <div class="float">
        <div class="book intro" id="book" role="button" tabindex="0" aria-label="StudyQuest brochure. Press to open or turn.">
          <div class="sheet center">
            <div class="face front crease-l crease-r" style="background-image:url(panels/inside-middle.webp)"></div>
            <div class="face back" style="background-image:url(panels/outside-back.webp)"></div>
          </div>
          <div class="sheet wing left" id="L">
            <div class="face front crease-r" style="background-image:url(panels/inside-left.webp)"><i class="shade"></i></div>
            <div class="face back" style="background-image:url(panels/outside-front.webp)"><i class="shade"></i></div>
          </div>
          <div class="sheet wing right" id="R">
            <div class="face front crease-l" style="background-image:url(panels/inside-right.webp)"><i class="shade"></i></div>
            <div class="face back" style="background-image:url(panels/outside-flap.webp)"><i class="shade"></i></div>
          </div>
        </div>
      </div>
    </div>
    <div class="hint" id="hint">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5a2 2 0 0 1 4 0v5M13 10V8a2 2 0 0 1 4 0v4M17 11a2 2 0 0 1 4 0v3a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3.4L4 14a2 2 0 0 1 3.4-2L9 14"/></svg>
      Tap to open
    </div>
  </div>

  <div class="caption" aria-live="polite">
    <h1 id="capT">Front cover</h1>
    <p id="capS">Tap the brochure to open it</p>
  </div>

  <div class="controls">
    <button class="ghost" id="prev" aria-label="Previous">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Back
    </button>
    <button class="primary" id="next">
      <span id="nextLabel">Open</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button class="dark" id="flip">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/></svg>
      <span id="flipLabel">Flip over</span>
    </button>
    <a class="btn ghost" href="StudyQuest-Brochure.pdf" download>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>PDF
    </a>
  </div>
  <div class="dots" id="dots" role="tablist" aria-label="Brochure views"></div>
</main>

<footer>
  <span class="kbdline">Use <span class="kbd">←</span><span class="kbd">→</span> to turn, <span class="kbd">F</span> to flip · </span>
  Play now at <a href="https://studyquest-a547c.web.app" target="_blank" rel="noopener">studyquest-a547c.web.app</a><br>
  A capstone project by BSIT students of St. Mary's College of Bansalan, Inc.
</footer>

<script>
(() => {
  const book = document.getElementById('book'), L = document.getElementById('L'), R = document.getElementById('R');
  const tilt = document.getElementById('tilt'), stage = document.getElementById('stage'), floor = document.getElementById('floor');
  const hint = document.getElementById('hint');
  const capT = document.getElementById('capT'), capS = document.getElementById('capS');
  const nextBtn = document.getElementById('next'), prevBtn = document.getElementById('prev'), flipBtn = document.getElementById('flip');
  const nextLabel = document.getElementById('nextLabel'), flipLabel = document.getElementById('flipLabel');
  const dotsEl = document.getElementById('dots');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const VIEWS = [
    { t: 'Front cover', s: 'Tap the brochure to open it', next: 'Open' },
    { t: 'Inside the cover', s: 'How to play, plus your subjects. Keep going!', next: 'Unfold' },
    { t: 'The full quest', s: 'Subjects, progress and battles, all in one spread', next: 'Close' },
    { t: 'Back panel', s: 'Scan the QR code to start your quest', next: 'Open' }
  ];
  let state = 0, busy = false, aL = 180, aR = -180, W = 300, H = 695;

  VIEWS.forEach((v, i) => {
    const d = document.createElement('button');
    d.className = 'dot'; d.setAttribute('role', 'tab'); d.setAttribute('aria-label', v.t);
    d.addEventListener('click', () => goTo(i));
    dotsEl.appendChild(d);
  });

  function setWing(el, deg, depth) {
    const k = (1 - Math.cos(deg * Math.PI / 180)) / 2;           // 0 open … 1 closed
    el.style.transform = `rotateY(${deg}deg) translateZ(${-depth * k}px)`;
    const sh = Math.abs(Math.sin(deg * Math.PI / 180)) * 0.9;
    el.querySelectorAll('.shade').forEach(s => s.style.opacity = sh);
  }
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function turn(which, to, ms = 1000) {
    return new Promise(res => {
      const from = which === 'L' ? aL : aR;
      if (from === to) return res();
      if (reduce) ms = 1;
      const t0 = performance.now();
      const step = now => {
        const p = Math.min(1, (now - t0) / ms), v = from + (to - from) * ease(p);
        if (which === 'L') { aL = v; setWing(L, v, 6); } else { aR = v; setWing(R, v, 3); }
        p < 1 ? requestAnimationFrame(step) : res();
      };
      requestAnimationFrame(step);
    });
  }
  const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));

  function size() {
    const availH = Math.max(320, window.innerHeight - 290);
    W = Math.round(Math.min(380, availH * 352 / 816, window.innerWidth - 48));
    H = Math.round(W * 816 / 352);
    book.style.width = W + 'px'; book.style.height = H + 'px';
    stage.style.height = (H + 50) + 'px';
    layout(state, true);
  }
  function layout(s) {
    const span = s === 2 ? 3 : s === 1 ? 2 : 1;
    const off = s === 1 ? W / 2 : 0;
    const sc = Math.min(1, (window.innerWidth - 24) / (span * W));
    const flip = s === 3 ? 180 : 0;
    book.style.transform = `translateX(${off * sc}px) scale(${sc}) rotateY(${flip}deg)`;
    floor.style.width = (span * W * sc * 0.95) + 'px';
  }

  function ui() {
    const v = VIEWS[state];
    capT.textContent = v.t; capS.textContent = v.s; nextLabel.textContent = v.next;
    prevBtn.disabled = state === 0;
    flipLabel.textContent = state === 3 ? 'Front side' : 'Flip over';
    [...dotsEl.children].forEach((d, i) => { d.classList.toggle('on', i === state); d.setAttribute('aria-selected', i === state); });
  }

  function sparkle() {
    if (reduce) return;
    const star = '<svg viewBox="0 0 24 24"><path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5Z" fill="COL"/></svg>';
    const cols = ['#F2B33D', '#E9935B', '#5B3FB8', '#E86A5A', '#FFFFFF'];
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('div'); s.className = 'spark';
      const ang = Math.random() * Math.PI * 2, dist = 120 + Math.random() * Math.min(window.innerWidth * .45, 420);
      s.style.setProperty('--dx', Math.cos(ang) * dist + 'px'); s.style.setProperty('--dy', Math.sin(ang) * dist * .7 + 'px');
      const sz = 10 + Math.random() * 14; s.style.width = s.style.height = sz + 'px';
      s.style.animationDelay = (Math.random() * .15) + 's';
      s.innerHTML = star.replace('COL', cols[i % cols.length]);
      stage.appendChild(s); setTimeout(() => s.remove(), 1500);
    }
  }

  let peekP = null;
  async function goTo(target) {
    if (peekP) { const p = peekP; peekP = null; await p; }
    if (busy || target === state) return;
    busy = true; hint.classList.add('hide');
    if (state === 3) { state = 0; layout(0); ui(); await wait(900); }
    if (target === 3) {
      if (aR !== -180) { layout(1); await turn('R', -180, 850); }
      if (aL !== 180) { layout(0); await turn('L', 180, 950); }
      state = 3; layout(3); ui(); await wait(900);
    } else {
      if (target >= 1 && aL !== 0) { layout(1); state = 1; ui(); await turn('L', 0, 1000); }
      if (target === 2 && aR !== 0) { layout(2); state = 2; ui(); await turn('R', 0, 950); sparkle(); }
      if (target < 2 && aR !== -180) { layout(1); state = 1; ui(); await turn('R', -180, 850); }
      if (target < 1 && aL !== 180) { layout(0); state = 0; ui(); await turn('L', 180, 950); }
      state = target; layout(target); ui();
    }
    busy = false;
  }
  const next = () => goTo(state === 3 ? 1 : state === 2 ? 0 : state + 1);
  const prev = () => goTo(state === 3 ? 0 : Math.max(0, state - 1));

  book.addEventListener('click', next);
  book.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } });
  nextBtn.addEventListener('click', next);
  prevBtn.addEventListener('click', prev);
  flipBtn.addEventListener('click', () => goTo(state === 3 ? 0 : 3));
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('button,a')) return;
    if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
    else if (e.key === 'f' || e.key === 'F') goTo(state === 3 ? 0 : 3);
  });

  // swipe
  let sx = null;
  stage.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (dx < -45) next(); else if (dx > 45) prev();
  });

  // gentle 3D tilt that follows the pointer
  if (!reduce && matchMedia('(hover: hover)').matches) {
    stage.addEventListener('mousemove', e => {
      const r = stage.getBoundingClientRect();
      const dx = (e.clientX - r.left) / r.width - .5, dy = (e.clientY - r.top) / r.height - .5;
      tilt.style.transform = `rotateX(${-dy * 10}deg) rotateY(${dx * 14}deg)`;
    });
    stage.addEventListener('mouseleave', () => { tilt.style.transform = ''; });
  }

  setWing(L, aL, 6); setWing(R, aR, 3);
  size(); ui();
  window.addEventListener('resize', size);
  book.addEventListener('animationend', () => book.classList.remove('intro'), { once: true });

  // little "peek" to show it opens
  setTimeout(() => {
    if (state !== 0 || busy || reduce) return;
    peekP = (async () => { await turn('L', 145, 600); await turn('L', 180, 700); })();
    peekP.then(() => { peekP = null; });
  }, 1500);
})();
</script>
</body>
</html>
